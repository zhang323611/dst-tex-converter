name: build-apk

# Gradle 构建（资源层 + AndroidX + CMake native）
# 产物：app-release.apk（artifact，保留 14 天）

on:
  push:
    branches: [ rebuild ]
  pull_request:
    branches: [ rebuild ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 恢复签名密钥（多次构建签名一致，可覆盖升级）
        uses: actions/cache@v4
        with:
          path: ~/.dsttex
          key: dsttex-keystore-v1

      - name: 生成签名密钥（若缓存未命中）
        run: |
          if [ ! -f "$HOME/.dsttex/dsttex.jks" ]; then
            mkdir -p "$HOME/.dsttex"
            keytool -genkeypair -keystore "$HOME/.dsttex/dsttex.jks" -alias dsttex \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass 123456 -keypass 123456 -dname "CN=DSTTex" -noprompt
            echo "已生成新的签名密钥"
          else
            echo "复用缓存中的签名密钥"
          fi

      - name: 补齐 SDK 组件（CMake / NDK 按 build.gradle 里 pin 的版本）
        run: |
          sdkmgr() { yes | sdkmanager "$@" > /dev/null 2>&1 || true; }
          [ -d "$ANDROID_SDK_ROOT/cmake/3.22.1" ] || sdkmgr "cmake;3.22.1"
          [ -d "$ANDROID_SDK_ROOT/ndk/27.3.13750724" ] || sdkmgr "ndk;27.3.13750724"
          ls "$ANDROID_SDK_ROOT/cmake/3.22.1/bin/cmake" "$ANDROID_SDK_ROOT/ndk/27.3.13750724/ndk-build" || true
          java -version

      - name: Gradle 构建
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          arguments: ':app:assembleRelease --no-daemon --stacktrace'

      - name: 定位产物并校验
        run: |
          APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
          echo "APK=$APK"
          cp "$APK" dst_tex_converter.apk
          ls -la dst_tex_converter.apk
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" verify --print-certs dst_tex_converter.apk || true
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt2" dump badging dst_tex_converter.apk | head -12 || true
          unzip -l dst_tex_converter.apk

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: dst_tex_converter-apk
          path: dst_tex_converter.apk
          retention-days: 14

      - name: 上传构建日志目录（失败时排查）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-logs
          path: |
            app/build/outputs/logs/
            app/.cxx/
          retention-days: 7
          if-no-files-found: ignore
